<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tachka</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #2b2620; --muted: #7a7064; --line: #e3dccd;
  --accent: #8a3b12; --accent-ink: #fff; --king: #efe3c8; --human: #dfe9f2; --warn: #b3261e; --ok: #2f6f3e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17140f; --panel: #211d16; --ink: #ece4d3; --muted: #9a8f7c; --line: #3a3326;
    --accent: #d9803f; --accent-ink: #1a1208; --king: #332a1a; --human: #1f2d3a; --warn: #ff8a80; --ok: #7fcf8d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font: 700 20px/1 Georgia, serif; margin: 0; letter-spacing: .5px; color: var(--accent); }
.pill { padding: 2px 10px; border-radius: 99px; background: var(--king); font-size: 13px; }
.pill.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.res { display: flex; flex-wrap: wrap; gap: 6px; }
.res span { font-variant-numeric: tabular-nums; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
.icon { image-rendering: auto; vertical-align: middle; flex: none; }
.res span { display: inline-flex; align-items: center; gap: 4px; }
aside li:has(> img.icon) { display: flex; gap: 8px; align-items: flex-start; }
.town { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 12px; }
.town > div { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; margin-top: 3px; }
.label { font: 11px var(--mono, monospace); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); min-width: 84px; }
.army small { font-size: 10px; color: var(--muted); margin-left: 2px; }
.dim { opacity: .45; }
.army { display: inline-flex; flex-wrap: wrap; gap: 2px 8px; }
.army > span { display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.res b { font-weight: 600; margin-right: 4px; color: var(--muted); }
.spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#feed { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; background: var(--king); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.human { align-self: flex-end; background: var(--human); }
.msg small { display: block; color: var(--muted); margin-top: 4px; }
.thought { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 2px 4px; border-left: 3px solid var(--line); max-width: 92%; overflow-wrap: anywhere; }
.thought b { color: var(--ink); font-weight: 600; }
.turn { align-self: stretch; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.turn b { color: var(--accent); }
.problem { align-self: stretch; color: var(--warn); font-size: 13px; padding: 6px 10px; border: 1px solid var(--warn); border-radius: 8px; overflow-wrap: anywhere; }
form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
textarea { flex: 1; resize: none; height: 44px; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
aside { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
h2 { margin: 0 0 6px; font: 600 12px/1 system-ui; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
ul { margin: 0; padding-left: 18px; }
li { margin: 2px 0; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); }
pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { max-height: 40vh; border-top: 1px solid var(--line); } .chat { border-right: 0; } body { height: auto; min-height: 100vh; } }
</style>
</head>
<body>
<header>
  <h1>TACHKA</h1>
  <span class="pill" id="day">connecting…</span>
  <span class="pill" id="status">idle</span>
  <div class="res" id="res"></div>
  <span class="spacer"></span>
  <span class="muted" id="cost"></span>
  <button id="pause">Pause</button>
</header>
<main>
  <div class="chat">
    <div id="feed" aria-live="polite"></div>
    <form id="form">
      <textarea id="text" placeholder="Talk to the king: advice, a question, a change of plan…" aria-label="Message to the king"></textarea>
      <button class="primary" type="submit">Send</button>
    </form>
  </div>
  <aside>
    <section><h2>Heroes</h2><div id="heroes" class="muted">waiting for the first turn</div></section>
    <section><h2>Towns</h2><div id="towns" class="muted"></div></section>
    <section><h2>Blocked</h2><div id="blockers" class="muted"></div></section>
    <section><h2>Strategy</h2><div id="memory" class="muted">none yet</div></section>
    <section><h2>Plan</h2><div id="plan" class="muted"></div></section>
    <section id="finalbox" hidden><h2>Game over</h2><div id="final"></div></section>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const feed = $("feed");
const short = s => String(s).replace(/^core:/, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let paused = false, lastDay = 0;

// icons come from the user's own game data (npm run assets); without them the page shows text only
let assets = { resources: [], creatures: [], heroes: {}, towns: [] };
fetch("/assets/manifest.json").then(r => r.ok ? r.json() : assets).then(m => { assets = m; nameRegex = undefined; if (lastFacts) showFacts(lastFacts); }).catch(() => {});
let lastFacts;
// "Dragon Flies" in running text becomes "Dragon Flies <icon>"; tags are left alone
let nameRegex;
function decorate(html) {
  const names = Object.keys(assets.creatureNames || {});
  if (!names.length) return html;
  nameRegex ||= new RegExp("\\b(" + names.sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "gi");
  nameRegex.lastIndex = 0;
  return html.split(/(<[^>]+>)/).map((part, i) => i % 2 ? part : part.replace(nameRegex, (m) => {
    const id = assets.creatureNames[m.toLowerCase()];
    return `${m}${id ? " " + img(`creatures/${id}.png`, m, 22) : ""}`;
  })).join("");
}
const img = (path, title, size) => `<img class="icon" src="/assets/${path}" alt="" title="${esc(title)}" width="${size}" height="${size}">`;
const resIcon = k => assets.resources.includes(k) ? img(`resources/${k}.png`, k, 22) : `<b>${esc(k)}</b>`;
const creatureIcon = c => assets.creatures.includes(short(c).toLowerCase()) ? img(`creatures/${short(c).toLowerCase()}.png`, short(c), 28) : "";
const heroIcon = name => assets.heroes[String(name).toLowerCase()] ? img(assets.heroes[String(name).toLowerCase()], name, 40) : "";
const townIcon = faction => assets.towns.includes(short(faction)) ? img(`towns/${short(faction)}.png`, short(faction), 40) : "";

function add(cls, html) {
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const el = document.createElement("div");
  el.className = cls; el.innerHTML = decorate(html); feed.appendChild(el);
  if (nearBottom) feed.scrollTop = feed.scrollHeight;
}
function status(text, busy) { const s = $("status"); s.textContent = text; s.classList.toggle("busy", !!busy); }
function tokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); }

const unit = (name, n, extra) => `<span title="${esc(short(name))}${extra ? " " + esc(extra) : ""}">${creatureIcon(name)}${n}${creatureIcon(name) ? "" : " " + esc(short(name))}</span>`;
const HALLS = [["capitol", "Capitol"], ["cityHall", "City Hall"], ["townHall", "Town Hall"], ["villageHall", "Village Hall"]];
const WALLS = [["castle", "Castle"], ["citadel", "Citadel"], ["fort", "Fort"]];
const highest = (t, list) => { const have = t.buildings.map(short); const hit = list.find(([id]) => have.includes(id)); return hit ? hit[1] : "none"; };
function townCard(t) {
  const dwellings = t.buildings.filter(b => /dwelling/i.test(b)).length;
  const stock = (t.stock || []).slice().sort((a, b) => a.level - b.level);
  const garrison = t.garrisonArmy || [];
  const total = garrison.reduce((n, a) => n + a.count, 0);
  const waiting = stock.reduce((n, s) => n + s.available, 0);
  return `<div class="town">${townIcon(t.faction)}<div>
    <b>${esc(t.name)}</b> <span class="muted">${esc(short(t.faction))} · ${t.buildings.length} buildings · ${dwellings} dwellings</span>
    <div class="row"><span class="label">hall</span><b>${highest(t, HALLS)}</b><span class="label" style="min-width:0;margin-left:10px">walls</span><b>${highest(t, WALLS)}</b></div>
    <span class="muted">${t.hasVisitingHero ? " · hero visiting" : ""}${t.hasGarrisonHero ? " · hero garrisoned" : ""}</span>
    <div class="row"><span class="label" title="Units waiting in the built dwellings; they are not ours until bought">in dwellings</span>${stock.length ? `<span class="army">${stock.map(s => `<span class="${s.available ? "" : "dim"}" title="level ${s.level} dwelling, ${s.available} available">${creatureIcon(s.creature)}${s.available}${creatureIcon(s.creature) ? "" : " " + esc(short(s.creature))}<small>L${s.level + 1}</small></span>`).join("")}</span><span class="muted"> ${waiting} to buy</span>` : '<span class="muted">no dwellings built</span>'}</div>
    <div class="row"><span class="label" title="Units we already bought that stand in the town's garrison">in garrison</span>${garrison.length ? `<span class="army">${garrison.map(a => unit(a.creature, a.count)).join("")}</span><span class="muted"> ${total} units</span>` : '<span class="muted">empty</span>'}</div>
  </div></div>`;
}

function showFacts(f) {
  lastFacts = f;
  lastDay = f.day;
  $("day").textContent = `Day ${f.day} · week ${f.week}`;
  $("res").innerHTML = Object.entries(f.resources).map(([k, v]) => `<span title="${esc(k)}">${resIcon(k)}${v}${f.income && f.income[k] ? ` <span class="muted">${f.income[k] > 0 ? "+" : ""}${f.income[k]}</span>` : ""}</span>`).join("");
  $("heroes").innerHTML = f.heroes.length ? "<ul>" + f.heroes.map(h => `<li>${heroIcon(h.name)}<div><b>${esc(h.name)}</b> ${esc(short(h.class))} L${h.level} at ${h.pos.x},${h.pos.y} · move ${h.movement}<br><span class="army">${h.army.map(a => `<span title="${esc(short(a.creature))}">${creatureIcon(a.creature)}${a.count}${creatureIcon(a.creature) ? "" : " " + esc(short(a.creature))}</span>`).join("") || '<span class="muted">no army</span>'}</span><br><span class="muted">A${h.primarySkills.attack} D${h.primarySkills.defense} P${h.primarySkills.spellPower} K${h.primarySkills.knowledge}</span></div></li>`).join("") + "</ul>" : "no heroes";
  $("towns").innerHTML = f.towns.length ? f.towns.map(townCard).join("") : "no towns";
  $("blockers").innerHTML = f.blockers.length ? "<ul>" + f.blockers.map(b => `<li>${esc(short(b.building))} <span class="muted">short ${Object.entries(b.short).map(([k, v]) => v + " " + k).join(", ")} · ${b.suppliers.length ? "supply: " + esc(b.suppliers[0].site.name) + " (" + b.suppliers[0].site.turns + " turns)" : "no known supplier"}</span></li>`).join("") + "</ul>" : "nothing blocked";
  $("memory").innerHTML = f.memory ? `<div><b>Goal</b> ${esc(f.memory.goal)}</div><div><b>Next</b> ${esc(f.memory.next)}</div>${f.memory.deferred.length ? "<div><b>Deferred</b></div><ul>" + f.memory.deferred.map(d => `<li>${esc(d.what)} <span class="muted">- ${esc(d.unlock)}</span></li>`).join("") + "</ul>" : ""}${f.memory.watch ? `<div><b>Watch</b> ${esc(f.memory.watch)}</div>` : ""}` : "none yet";
  $("plan").innerHTML = f.plan ? `<div>${esc(f.plan.note || "")}</div><div class="muted">review by day ${f.plan.reviewByDay}</div><details><summary>full plan</summary><pre>${esc(JSON.stringify(f.plan, null, 1))}</pre></details>` : "none yet";
  status("the king is thinking", true);
}

function handle(e) {
  switch (e.type) {
    case "facts": showFacts(e.facts); break;
    case "king":
      add("thought", `<b>Day ${lastDay}</b> ${esc(e.note)}<br><small>${tokens(e.usage.inputTokens)} in / ${tokens(e.usage.outputTokens)} out${e.usage.costUsd ? " · $" + e.usage.costUsd.toFixed(3) : ""}${e.ms ? " · " + (e.ms / 1000).toFixed(1) + " s" : ""}</small>`);
      $("cost").textContent = e.total.inputTokens ? `${tokens(e.total.inputTokens + e.total.outputTokens)} tokens${e.total.costUsd ? " · $" + e.total.costUsd.toFixed(2) : ""}` : "";
      status("acting", true); break;
    case "chat": add(e.from === "human" ? "msg human" : "msg", esc(e.text)); break;
    case "turn": add("turn", `<b>Day ${e.day}</b> ${esc(e.line)}`); status("waiting for my turn", false); break;
    case "status": status(e.text, false); add("turn", esc(e.text)); break;
    case "review": add("thought", `<b>Review</b> ${e.revised ? "(changed the move)" : "(kept the move)"}<br>${e.findings.map(esc).join("<br>")}`); break;
    case "query": add("thought", `asked the game: ${esc(e.text)}`); break;
    case "typing": {
      let el = $("typing");
      if (e.on && !el) { add("thought", "Tachka is typing…"); feed.lastChild.id = "typing"; }
      if (!e.on && el) el.remove();
      break;
    }
    case "final": {
      const g = e.final.gameOver || {};
      $("finalbox").hidden = false;
      $("final").innerHTML = `<div>${g.won ? "Tachka won." : g.lost ? "Tachka lost." : "The game ended."} <span class="muted">${esc(g.text || "")}</span></div><details><summary>final report</summary><pre>${esc(JSON.stringify(e.final, null, 1))}</pre></details>`;
      status("game over: talk to me", false); break;
    }
    case "problem": add("problem", esc(e.text)); break;
    case "paused": paused = true; $("pause").textContent = "Resume"; status("paused", false); break;
    case "resumed": paused = false; $("pause").textContent = "Pause"; break;
  }
}

const source = new EventSource("/events");
source.onmessage = m => handle(JSON.parse(m.data));
source.onerror = () => status("disconnected", false);

$("pause").onclick = () => fetch(paused ? "/resume" : "/pause", { method: "POST" });
$("form").onsubmit = ev => {
  ev.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  fetch("/say", { method: "POST", body: JSON.stringify({ text }) });
};
$("text").onkeydown = ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); } };
</script>
</body>
</html>
